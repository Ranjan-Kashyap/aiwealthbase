# Deploy AI Wealth Base to Cloudflare Workers on push to main.
# Required GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "ai-wealth-base-website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-wealth-base-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-wealth-base-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy (OpenNext)
        run: npx opennextjs-cloudflare deploy
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
